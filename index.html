<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 14px 0 8px; }
    h3 { font-size: 14px; margin: 12px 0 6px; color: #5c7378; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    button.mini { padding: 5px 9px; font-size: 12px; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 64px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .app { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .mapwrap { position: relative; }
    .map { position: relative; height: calc(100vh - 128px); min-height: 560px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    #linesSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 1; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; z-index: 2; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .list { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .timeline { display: grid; gap: 8px; max-height: 240px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .pill.linepill { background: #eef8f9; border-color: #9fc9cf; color: #1d6c78; }
    .st-normal { background: #e7f4ec; border-color: #9ccfac; color: #2c6e42; }
    .st-pending { background: #fdece7; border-color: #e7a38f; color: #b04122; font-weight: 800; }
    .st-archived { background: #eef0f1; border-color: #c2cbcd; color: #5c7378; }
    .muted { color: #5c7378; font-size: 13px; }
    .reasons { margin: 6px 0 4px; padding-left: 18px; color: #b04122; font-size: 13px; }
    .rowbtns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 8px; }
    .error { color: #b04122; font-size: 13px; min-height: 16px; margin: 4px 0; }
    .resurvey { margin-top: 10px; border: 1px dashed #e7a38f; border-radius: 8px; padding: 10px; background: #fdf7f5; }
    .archivebox { margin-top: 12px; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 560px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>水下考古潜水记录</h1><div class="muted">标记、测线与浮标回收台：点击平面图添加标记或布设测线，筛选、编辑、复测确认并导出JSON。</div></div>
    <button id="exportBtn">导出JSON</button>
  </header>
  <main class="app">
    <section class="panel mapwrap">
      <div class="map" id="map">
        <svg id="linesSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div class="wreck"></div>
      </div>
    </section>
    <aside class="panel">
      <div class="toolbar">
        <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <select id="view">
          <option value="list">标记列表</option>
          <option value="timeline">潜次时间线</option>
          <option value="lines">测线回收台</option>
        </select>
      </div>

      <!-- 原标记表单（新增关联测线） -->
      <div id="markBox">
        <form id="markForm">
          <h2>标记信息</h2>
          <input name="id" type="hidden">
          <label>编号</label><input name="code" required>
          <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <label>所属测线</label><select name="lineId"></select>
          <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
          <label>深度</label><input name="depth" placeholder="例如18.4m" required>
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>
          <div class="toolbar"><button>保存标记</button><button type="button" id="deleteMarkBtn" class="secondary">删除</button></div>
        </form>
      </div>
      <h2 id="listTitle">标记列表</h2>
      <div id="list" class="list"></div>

      <!-- 测线与浮标回收台 -->
      <div id="linesPane" style="display:none">
        <form id="lineForm">
          <h2>测线与浮标回收</h2>
          <input name="id" type="hidden">
          <div class="grid2">
            <div><label>测线号</label><input name="code" required></div>
            <div><label>版本</label><input name="version" value="1" required></div>
          </div>
          <label>布设测绘员</label><input name="surveyor" placeholder="布设人姓名" required>

          <h3>布设基线</h3>
          <div class="grid3">
            <div><label>A点编号</label><input name="aName" placeholder="BA-1"></div>
            <div><label>A点 X</label><input name="aDeployX" type="number" step="0.1" min="0" max="100" required></div>
            <div><label>A点 Y</label><input name="aDeployY" type="number" step="0.1" min="0" max="100" required></div>
          </div>
          <div class="grid3">
            <div><label>B点编号</label><input name="bName" placeholder="BA-2"></div>
            <div><label>B点 X</label><input name="bDeployX" type="number" step="0.1" min="0" max="100" required></div>
            <div><label>B点 Y</label><input name="bDeployY" type="number" step="0.1" min="0" max="100" required></div>
          </div>
          <div class="grid2">
            <div><label>布设时刻</label><input name="deployAt" placeholder="2026-09-10 08:20"></div>
            <div><label>布设流速</label><input name="flowDeploy" placeholder="0.3m/s"></div>
          </div>
          <div class="grid2">
            <div><label>布设淤积(cm)</label><input name="siltDeploy" type="number" step="0.1" min="0" placeholder="8"></div>
            <div><label>布设浮标</label><input name="buoyDeploy" placeholder="BUOY-11"></div>
          </div>

          <h3>回收基线点</h3>
          <div class="grid2">
            <div><label>A回收 X</label><input name="aRecoverX" type="number" step="0.1" min="0" max="100"></div>
            <div><label>A回收 Y</label><input name="aRecoverY" type="number" step="0.1" min="0" max="100"></div>
          </div>
          <div class="grid2">
            <div><label>B回收 X</label><input name="bRecoverX" type="number" step="0.1" min="0" max="100"></div>
            <div><label>B回收 Y</label><input name="bRecoverY" type="number" step="0.1" min="0" max="100"></div>
          </div>
          <div class="grid2">
            <div><label>回收时刻</label><input name="recoverAt" placeholder="2026-09-12 15:40"></div>
            <div><label>回收流速</label><input name="flowRecover" placeholder="0.4m/s"></div>
          </div>
          <div class="grid2">
            <div><label>回收淤积(cm)</label><input name="siltRecover" type="number" step="0.1" min="0" placeholder="9"></div>
            <div><label>回收浮标</label><input name="buoyRecover" placeholder="BUOY-11"></div>
          </div>
          <label>备注</label><textarea name="note"></textarea>
          <div class="toolbar"><button>保存测线</button><button type="button" id="newLineBtn" class="secondary">新增测线</button></div>
          <div class="error" id="lineError"></div>
        </form>

        <!-- 复测确认（另一名测绘员重设基线） -->
        <div class="resurvey" id="resurveyBox" style="display:none">
          <form id="resurveyForm">
            <input type="hidden" name="lineId">
            <h2>复测确认</h2>
            <div class="muted">待复测测线须由不同于布设测绘员的另一名测绘员确认，并以重设后的基线生成新版本；旧版自动留档。</div>
            <div class="grid2">
              <div><label>复测测绘员</label><input name="checker" placeholder="另一名测绘员" required></div>
              <div><label>复测时刻</label><input name="checkAt" required></div>
            </div>
            <label>复测原因</label><input name="reason" placeholder="如：水流推移浮标、淤泥掩埋基线点">
            <h3>重设基线（A）</h3>
            <div class="grid3">
              <div><label>A点编号</label><input name="aName" required></div>
              <div><label>A点 X</label><input name="ax" type="number" step="0.1" min="0" max="100" required></div>
              <div><label>A点 Y</label><input name="ay" type="number" step="0.1" min="0" max="100" required></div>
            </div>
            <h3>重设基线（B）</h3>
            <div class="grid3">
              <div><label>B点编号</label><input name="bName" required></div>
              <div><label>B点 X</label><input name="bx" type="number" step="0.1" min="0" max="100" required></div>
              <div><label>B点 Y</label><input name="by" type="number" step="0.1" min="0" max="100" required></div>
            </div>
            <label>重布浮标</label><input name="buoy" required>
            <label>备注</label><textarea name="remark"></textarea>
            <div class="toolbar"><button>确认复测并重设基线</button><button type="button" id="cancelResurveyBtn" class="secondary">取消</button></div>
            <div class="error" id="resurveyErrors"></div>
          </form>
        </div>

        <h2>测线列表</h2>
        <div id="lineList" class="list"></div>

        <div class="archivebox">
          <h2>旧版留档</h2>
          <div id="archiveList" class="list"></div>
        </div>
      </div>
    </aside>
  </main>
  <script src="js/judge.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/page.js"></script>
</body>
</html>
