<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2, h3 { margin: 0 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 56px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .hidden { display: none !important; }
    .tabs { display: flex; gap: 8px; }
    .tab { background: #64777b; }
    .tab.active { background: #1d6c78; }
    .app { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px; align-items: start; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .map { position: relative; height: calc(100vh - 128px); min-height: 560px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .list { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .timeline { display: grid; gap: 8px; max-height: 240px; overflow: auto; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .muted { color: #5c7378; font-size: 13px; }
    /* 测线回收台 */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-sec { grid-column: 1 / -1; margin: 12px 0 2px; font-size: 13px; font-weight: 800; color: #1d6c78; border-top: 1px dashed #c9dadc; padding-top: 10px; }
    .line-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .line-toolbar select { width: auto; min-width: 130px; }
    .line-list { display: grid; gap: 10px; max-height: 52vh; overflow: auto; margin: 10px 0 14px; }
    .line-card { border: 1px solid #d7e4e5; border-left-width: 5px; border-radius: 8px; padding: 10px; display: grid; gap: 6px; }
    .line-card.normal { border-left-color: #3d8b54; }
    .line-card.resurvey { border-left-color: #c0492f; background: #fdf6f3; }
    .line-card.deployed { border-left-color: #8aa0a4; }
    .line-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .line-head .spacer { flex: 1; }
    .line-head button { padding: 5px 10px; font-size: 12px; }
    .line-head button.danger { background: #c0492f; }
    .pill.status.normal { background: #e4f2e8; color: #2f6b41; border-color: #b7d8c1; }
    .pill.status.resurvey { background: #f7e3dd; color: #a03a22; border-color: #e2b3a6; }
    .pill.status.deployed { background: #eef2f3; color: #5c7378; border-color: #cddadb; }
    .reasons { margin: 0; padding-left: 18px; color: #a03a22; font-size: 13px; }
    .archive-list { display: grid; gap: 8px; }
    .archive-card { border: 1px dashed #c9dadc; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .archive-card summary { cursor: pointer; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .archive-card .body { margin-top: 8px; display: grid; gap: 4px; }
    .error { background: #f7e3dd; color: #a03a22; border: 1px solid #e2b3a6; border-radius: 6px; padding: 8px; margin: 8px 0 0; font-size: 13px; }
    .info { background: #eef8f9; border: 1px solid #b9d6da; border-radius: 6px; padding: 8px; margin: 6px 0; font-size: 13px; }
    @media (max-width: 980px) {
      header { display: block; }
      .tabs { margin-top: 10px; }
      .app { grid-template-columns: 1fr; }
      .map { height: 480px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>水下考古潜水记录</h1>
      <div class="muted" id="subtitle">标记台：点击沉船平面图添加标记，筛选、编辑并导出JSON。</div>
    </div>
    <nav class="tabs">
      <button id="tabMarks" class="tab active" type="button">标记台</button>
      <button id="tabLines" class="tab" type="button">测线与浮标回收台</button>
    </nav>
  </header>

  <!-- 标记台（原有视图） -->
  <section id="pageMarks" class="page">
    <main class="app">
      <section class="panel">
        <div class="panel-head">
          <h2>沉船平面图</h2>
          <button id="exportBtn" type="button">导出JSON</button>
        </div>
        <div class="map" id="map"><div class="wreck"></div></div>
      </section>
      <aside class="panel">
        <div class="toolbar">
          <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <select id="view"><option value="list">标记列表</option><option value="timeline">潜次时间线</option></select>
        </div>
        <form id="form">
          <h2>标记信息</h2>
          <input name="id" type="hidden">
          <label>编号</label><input name="code" required>
          <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <label>关联测线</label><select name="lineCode"><option value="">不关联</option></select>
          <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
          <label>深度</label><input name="depth" placeholder="例如18.4m" required>
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>
          <div class="toolbar"><button>保存标记</button><button type="button" id="deleteBtn" class="secondary">删除</button></div>
        </form>
        <h2 id="listTitle" style="margin-top:14px">标记列表</h2>
        <div id="list" class="list"></div>
      </aside>
    </main>
  </section>

  <!-- 测线与浮标回收台 -->
  <section id="pageLines" class="page hidden">
    <main class="app">
      <section class="panel">
        <div class="panel-head">
          <h2>测线与浮标回收</h2>
          <div class="line-toolbar">
            <select id="lineFilter">
              <option value="">全部状态</option>
              <option value="resurvey">待复测</option>
              <option value="normal">正常</option>
              <option value="deployed">未回收</option>
            </select>
            <button id="newLineBtn" type="button">登记新测线</button>
            <button id="exportLinesBtn" type="button" class="secondary">导出测线JSON</button>
          </div>
        </div>
        <div id="lineList" class="line-list"></div>
        <h3>旧版留档</h3>
        <div id="archiveList" class="archive-list"></div>
      </section>
      <aside class="panel">
        <form id="lineForm">
          <h2 id="lineFormTitle">测线登记</h2>
          <input name="id" type="hidden">
          <input name="version" type="hidden" value="1">
          <div class="form-grid">
            <div><label>测线号</label><input name="code" required placeholder="L-01"></div>
            <div><label>浮标编号</label><input name="buoyCode" placeholder="B-01"></div>

            <div class="form-sec">布设基线</div>
            <div><label>起点基线点</label><input name="startPoint" placeholder="BP-甲"></div>
            <div><label>终点基线点</label><input name="endPoint" placeholder="BP-乙"></div>
            <div><label>布设起点X（米）</label><input name="deployStartX" inputmode="decimal"></div>
            <div><label>布设起点Y（米）</label><input name="deployStartY" inputmode="decimal"></div>
            <div><label>布设终点X（米）</label><input name="deployEndX" inputmode="decimal"></div>
            <div><label>布设终点Y（米）</label><input name="deployEndY" inputmode="decimal"></div>
            <div><label>布设时刻</label><input name="deployedAt" type="datetime-local"></div>
            <div><label>布设淤积（厘米）</label><input name="siltDeploy" inputmode="decimal"></div>

            <div class="form-sec">回收记录</div>
            <div><label>回收时刻</label><input name="recoveredAt" type="datetime-local"></div>
            <div><label>回收淤积（厘米）</label><input name="siltRecover" inputmode="decimal"></div>
            <div><label>回收起点X（米）</label><input name="recoverStartX" inputmode="decimal"></div>
            <div><label>回收起点Y（米）</label><input name="recoverStartY" inputmode="decimal"></div>
            <div><label>回收终点X（米）</label><input name="recoverEndX" inputmode="decimal"></div>
            <div><label>回收终点Y（米）</label><input name="recoverEndY" inputmode="decimal"></div>
            <div><label>流速（米/秒）</label><input name="currentSpeed" inputmode="decimal" placeholder="0.30"></div>
            <div><label>浮标实际回收所在测线</label><input name="foundLineCode" placeholder="串线时与测线号不同"></div>

            <div class="form-sec">登记信息</div>
            <div><label>测绘员</label><input name="surveyor" required placeholder="布设/回收测绘员"></div>
            <div class="full"><label>备注</label><textarea name="note"></textarea></div>
          </div>
          <div class="toolbar" style="margin-top:10px">
            <button>保存测线</button>
            <button type="button" id="lineCancelBtn" class="secondary hidden">取消编辑</button>
          </div>
        </form>

        <form id="resurveyForm" class="hidden" style="margin-top:16px">
          <h2 id="resurveyTitle">复测确认</h2>
          <div class="info" id="resurveyInfo"></div>
          <div class="form-grid">
            <div class="full"><label>复测测绘员（须为另一名测绘员）</label><input name="confirmer" required placeholder="复测确认人姓名"></div>
            <div class="form-sec">重设基线</div>
            <div><label>新起点基线点</label><input name="resetStartPoint" required></div>
            <div><label>新终点基线点</label><input name="resetEndPoint" required></div>
            <div><label>新起点X（米）</label><input name="resetStartX" inputmode="decimal" required></div>
            <div><label>新起点Y（米）</label><input name="resetStartY" inputmode="decimal" required></div>
            <div><label>新终点X（米）</label><input name="resetEndX" inputmode="decimal" required></div>
            <div><label>新终点Y（米）</label><input name="resetEndY" inputmode="decimal" required></div>
            <div><label>复测时刻</label><input name="confirmedAt" type="datetime-local"></div>
            <div><label>重布淤积（厘米）</label><input name="resilt" inputmode="decimal"></div>
            <div><label>复测流速（米/秒）</label><input name="recurrent" inputmode="decimal"></div>
            <div class="full"><label>复测备注</label><textarea name="renote"></textarea></div>
          </div>
          <div id="resurveyError" class="error hidden"></div>
          <div class="toolbar" style="margin-top:10px">
            <button>确认复测并重设基线</button>
            <button type="button" id="resurveyCancelBtn" class="secondary">取消</button>
          </div>
        </form>
      </aside>
    </main>
  </section>

  <!-- 三个业务文件：判定 judge.js、存档 archive.js、页面 page.js（经典脚本，支持 file:// 直接打开） -->
  <script src="js/judge.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/page.js"></script>
</body>
</html>
